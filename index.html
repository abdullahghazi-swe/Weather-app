<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>Weather App</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <div class="logo">Skies</div>
        <button class="setting-btn">⚙️</button>
    </header>
    <main>
        <div class="location-box">
            <div class="time-search">
                <div class="time"></div>
                <div class="search">
                    <div class="searchbar">
                        <input class="searchField" type="search" placeholder="Search city...">
                        <button class="btn show">🔍</button>
                    </div>
                    <div class="search-results"></div>
                </div>
            </div>
            <div class="current-location">
                <div class="area">
                    <div class="city"></div>
                    <div class="country"></div>
                </div>
                <div class="city-controls">
                    <div class="default-location">
                        <span class="star">☆</span>
                        <span class="default-text">Set as default</span>
                    </div>
                    <div class="addToFav">
                        <span class="fav-star">☆</span>
                        <span class="fav-text">Add to Favorites</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="weather">
            <div class="current-weather">
                <div class="current-left">
                    <div class="temperature">
                        <div class="temp"></div> 
                        <span class="temp-unit"></span>
                    </div>
                    <div class="weather-state"></div>
                    <div class="apparant-temp">
                        <span>Feels Like </span>
                        <span class="feels"></span>
                        <span class="feels-unit"></span>
                    </div>
                </div>
                <div class="current-right">
                    <div class="weather-icon">☁️</div>
                    <div class="precipitation">
                        <span>Precip · </span>
                        <span class="precipProbability"></span>
                        <span>%</span>
                    </div>
                </div>
            </div>
            <div class="current-conditions">
                <div class="condition">
                    <p class="condition-text">Wind Speed</p>
                    <span class="wind"></span>
                    <span class="wind-unit"></span>
                </div>
                <div class="condition">
                    <p class="condition-text">UV Index</p>
                    <span class="uv"></span>
                </div>
                <div class="condition">
                    <p class="condition-text">AQI</p>
                    <span class="aqi"></span>
                </div>
                <div class="condition">
                    <p class="condition-text">Visibility</p>
                    <span class="visibility"></span>
                    <span class="visib-unit"></span>
                </div>
            </div>
        </div>

        <div class="forcast">
            <div class="hourlyForcast">
                <h3>Hourly Forecast</h3>
                <button class="hourly-scroll left">❮</button>
                <div class="hour-list"></div>
                <button class="hourly-scroll right show">❯</button>
            </div>
            <div class="dailyForcast">
                <h3>7-day Forecast</h3>
                <div class="day-list"></div>
            </div>
        </div>
        <div class="info-box">
            <div class="info">
                <p class="info-text">Humidity</p>
                <span class="hum"></span>
                <span class="hum-unit"> %</span>
            </div>
            <div class="info">
                <p class="info-text">Pressure</p>
                <span class="pressure"></span>
                <span class="pressure-unit"></span>
            </div>
            <div class="info">
                <p class="info-text">Precipitation</p>
                <span class="precip"></span>
                <span class="precip-unit"></span>
            </div>
            <div class="info">
                <p class="info-text">Dew Point</p>
                <span class="dew"></span>
                <span class="dew-unit"></span>
            </div>
        </div>
        <footer>
            <div class="updateTime"></div>
        </footer>
    </main>
    
    <div class="favorites">
        <h3>Favorites</h3>
        <div class="favorites-list"></div>
    </div>
    <div class="app-loading"></div>
    <div class="toastBox"></div>
    <div class="setting-overlay">
        <div class="settings">
            <div class="setting-head">
                <h3>Preferences</h3>
                <button class="close-btn">&times;</button>
            </div>
            <div class="units">
                <h4>Units</h4>
                <div class="weather-unit">
                    <h5>Temperature</h5>
                    <div class="setting-btns">
                        <button class="unit-btn" data-type="temp" data-unit="celsius">°C</button>
                        <button class="unit-btn" data-type="temp" data-unit="fahrenheit">°F</button>
                    </div>
                </div>
                <div class="weather-unit">
                    <h5>Pressure</h5>
                    <div class="setting-btns">
                        <button class="unit-btn" data-type="pres" data-unit="hectopascals">hPa</button>
                        <button class="unit-btn" data-type="pres" data-unit="millimetersOfMercury">mmHg</button>
                    </div>
                </div>
                <div class="weather-unit">
                    <h5>Precipitation</h5>
                    <div class="setting-btns">
                        <button class="unit-btn" data-type="precip" data-unit="millimeters">mm</button>
                        <button class="unit-btn" data-type="precip" data-unit="inches">in</button>
                    </div>
                </div>
                <div class="weather-unit">
                    <h5>Wind Speed</h5>
                    <div class="setting-btns">
                        <button class="unit-btn" data-type="wind" data-unit="kilometersPerHour">Km/h</button>
                        <button class="unit-btn" data-type="wind" data-unit="milesPerHour">mph</button>
                        <button class="unit-btn" data-type="wind" data-unit="knots">kn</button>
                    </div>
                </div>
                <div class="weather-unit">
                    <h5>Visibility</h5>
                    <div class="setting-btns">
                        <button class="unit-btn" data-type="visib" data-unit="kilometers">Km</button>
                        <button class="unit-btn" data-type="visib" data-unit="miles">mi</button>
                        <button class="unit-btn" data-type="visib" data-unit="meters">m</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="src/main.js" defer></script>
</body>
</html>
