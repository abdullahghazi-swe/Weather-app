<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="search">
        <div class="searchBox">
            <input type="search" placeholder="Search city...">
            <div class="search-results"></div>
            <span class="searchErrors"></span>
        </div>
    </div>
    <div class="weather">
        <div class="location">
            <div class="time"></div>
            <div class="location-detail">
                <div class="loc-left">
                    <div class="city"></div>
                </div>
                <div class="loc-right">
                    <div class="default-location">
                        <span class="star">☆</span>
                        <span class="default-text">Set as default</span>
                    </div>
                </div>
            </div>
            <div class="country"></div>
        </div>
        <div class="weather-state"></div>
        <div class="info-box">
            <div class="info">Temperature: <span class="temp"></span> °C</div>
            <div class="info">Feels Like: <span class="feels"></span> °C</div>
            <div class="info">Humidity: <span class="hum"></span> %</div>
            <div class="info">Pressure: <span class="pressure"></span> hpa</div>
            <div class="info">Wind Speed: <span class="wind"></span> km/h</div>
            <div class="info">UV Index: <span class="uv"></span></div>
            <div class="info">Precipitation: <span class="precp"></span>mm</div>
            <div class="info">Visibility: <span class="visibility"></span>m</div>
            <div class="updateTime"></div>
            <div class="addToFav">
                <span class="fav-star">☆</span>
                <span class="fav-text">Add to Favorites</span>
            </div>
        </div>
    </div>
    <div class="forcast">
        <div class="hourlyForcast"></div>
        <div class="dailyForcast"></div>
    </div>
    <div class="favorites"></div>
    
    <script type="module" src="src/main.js" defer></script>
</body>
</html>
